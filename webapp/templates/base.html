<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Package Scanner Catalog</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcfcfb;
        --fg: #161616;
        --link: #0b57d0;
        --border: #dddddd;
        --ok: #0a7d28;
        --bad: #b42318;
        --warn: #b54708;
        --muted: #666666;
        --code-bg: #f5f5f5;
        --chip-r-bg: #dff3e4;
        --chip-r-fg: #165b33;
        --chip-python-bg: #e4efff;
        --chip-python-fg: #1b4d9b;
        --chip-linux-bg: #e8f7eb;
        --chip-linux-fg: #1f6f43;
        --chip-windows-bg: #eef3ff;
        --chip-windows-fg: #2453a6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121417;
          --fg: #e8eaed;
          --link: #8ab4f8;
          --border: #3c4043;
          --ok: #7bd88f;
          --bad: #ff8a80;
          --warn: #f6c177;
          --muted: #aeb4bb;
          --code-bg: #1e2227;
          --chip-r-bg: #173025;
          --chip-r-fg: #95d5a7;
          --chip-python-bg: #18263b;
          --chip-python-fg: #9dc2ff;
          --chip-linux-bg: #173025;
          --chip-linux-fg: #95d5a7;
          --chip-windows-bg: #1a2440;
          --chip-windows-fg: #a8c4ff;
        }
      }
      * { box-sizing: border-box; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.45; max-width: 1500px; margin: 0 auto; color: var(--fg); background: var(--bg); }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
      main { padding: 1.5rem 2rem 3rem; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; min-width: 720px; }
      .table-scroll { overflow-x: auto; width: 100%; }
      th, td { border-bottom: 1px solid var(--border); padding: 0.7rem 0.65rem; text-align: left; vertical-align: top; }
      th { font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
      tbody tr:hover { background: rgba(127, 127, 127, 0.06); }
      form { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; margin-top: 1rem; }
      label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.95rem; }
      input, select, button { padding: 0.5rem 0.65rem; border: 1px solid var(--border); border-radius: 0.35rem; background: var(--bg); color: var(--fg); }
      button { cursor: pointer; font-weight: 600; }
      button:hover { border-color: var(--link); }
      button[disabled] { cursor: not-allowed; opacity: 0.55; }
      h1 { margin: 0 0 0.35rem; font-size: clamp(1.65rem, 3vw, 2.35rem); letter-spacing: -0.025em; }
      h2 { margin-top: 2rem; font-size: 1.25rem; }
      h3 { margin-top: 0; }
      .page-intro { margin-bottom: 1.5rem; }
      .card { border: 1px solid var(--border); border-radius: 0.65rem; padding: 1.15rem; margin-top: 1rem; background: rgba(127, 127, 127, 0.025); }
      .card-header { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
      .card-header h2, .card-header h3 { margin: 0; }
      .card-subtitle { margin: 0.25rem 0 0; color: var(--muted); }
      .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
      .queue-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 1rem; }
      .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
      .metric { border: 1px solid var(--border); border-radius: 0.55rem; padding: 0.85rem 1rem; }
      .metric-label { color: var(--muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .metric-value { display: block; margin-top: 0.2rem; font-size: 1.35rem; font-weight: 700; }
      .form-section { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; }
      .form-section:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
      .form-actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
      .checkbox-label { flex-direction: row; align-items: center; }
      .button-primary { background: var(--link); color: #fff; border-color: var(--link); }
      .chip-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0; }
      .chip { display: inline-block; padding: 0.2rem 0.45rem; border: 1px solid var(--border); border-radius: 999px; }
      .chip.checkbox-chip { background: rgba(11, 87, 208, 0.08); border-color: var(--link); font-weight: 600; }
      .chip.badge-r { background: var(--chip-r-bg); color: var(--chip-r-fg); border-color: transparent; }
      .chip.badge-python { background: var(--chip-python-bg); color: var(--chip-python-fg); border-color: transparent; }
      .chip.badge-linux-amd64, .chip.badge-linux-arm64 { background: var(--chip-linux-bg); color: var(--chip-linux-fg); border-color: transparent; }
      .chip.badge-windows { background: var(--chip-windows-bg); color: var(--chip-windows-fg); border-color: transparent; }
      .callout { border: 1px solid var(--link); border-radius: 0.45rem; padding: 0.85rem 1rem; margin: 1rem 0; background: rgba(11, 87, 208, 0.06); }
      .step-table td, .step-table th { font-size: 0.95rem; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .warn { color: var(--warn); }
      .muted { color: var(--muted); }
      .inline-filters { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
      .pager { display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 1rem; }
      .pager-links { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
      .action-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .stage-list { display: flex; gap: 0.3rem; flex-wrap: wrap; align-items: center; }
      .stage-chip { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.12rem 0.45rem; border-radius: 999px; border: 1px solid var(--border); font-size: 0.82rem; white-space: nowrap; }
      .stage-chip.done { background: rgba(10, 125, 40, 0.10); color: var(--ok); border-color: rgba(10, 125, 40, 0.35); }
      .stage-chip.current { background: rgba(11, 87, 208, 0.10); color: var(--link); border-color: rgba(11, 87, 208, 0.35); font-weight: 600; }
      .stage-chip.failed { background: rgba(180, 35, 24, 0.10); color: var(--bad); border-color: rgba(180, 35, 24, 0.35); }
      .stage-chip.pending { color: var(--muted); }
      code { background: var(--code-bg); padding: 0.1rem 0.3rem; border-radius: 0.2rem; }
      .site-header { border-bottom: 1px solid var(--border); padding: 0 2rem; background: rgba(127, 127, 127, 0.035); }
      .site-header-inner { min-height: 4.2rem; display: flex; gap: 1.5rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
      .brand { color: var(--fg); font-size: 1.05rem; font-weight: 750; letter-spacing: -0.015em; }
      .brand:hover { text-decoration: none; }
      .nav { display: flex; gap: 0.25rem; align-items: center; flex-wrap: wrap; }
      .nav a { color: var(--muted); padding: 0.45rem 0.65rem; border-radius: 0.35rem; font-size: 0.92rem; }
      .nav a:hover { color: var(--fg); background: rgba(127, 127, 127, 0.1); text-decoration: none; }
      @media (max-width: 700px) { main { padding: 1.15rem 1rem 2rem; } .site-header { padding: 0 1rem; } .queue-grid { grid-template-columns: 1fr; } .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/">Package Scanner</a>
        <nav class="nav" aria-label="Primary navigation">
          <a href="/">Dashboard</a>
          <a href="/candidates">Candidates</a>
          <a href="/runs/python">Python Runs</a>
          <a href="/runs/r">R Runs</a>
          <a href="/cleanup/failed">Cleanup</a>
        </nav>
      </div>
    </header>
    {% if auth_error %}
    <div style="margin: 1rem 0; padding: 0.75rem 1rem; border: 1px solid var(--bad); border-radius: 0.35rem; color: var(--bad);">
      {{ auth_error }} Reauthenticate with AWS SSO, then refresh the page.
    </div>
    {% endif %}
    <main>{% block body %}{% endblock %}</main>
  </body>
  </html>
