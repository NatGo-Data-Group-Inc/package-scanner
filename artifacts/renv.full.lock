      "Title": "Meta-Analysis Package for R",
      "Authors@R": "person(given = \"Wolfgang\", family = \"Viechtbauer\", role = c(\"aut\",\"cre\"), email = \"wvb@metafor-project.org\", comment = c(ORCID = \"0000-0003-3463-4063\"))",
      "Depends": [
        "R (>= 3.5.0)",
