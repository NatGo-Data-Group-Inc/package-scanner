AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Dedicated ECS Fargate service for the package scanner operator webapp, with
  on-demand runtime resources and optional custom DNS.

Parameters:
  EnvironmentName:
    Type: String
    Default: package-scanner-dev
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
  TlsCertificateArn:
    Type: String
    Default: ''
  CustomDomainName:
    Type: String
    Default: ''
  CustomDomainHostedZoneId:
    Type: String
    Default: ''
  RuntimeEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  IdleTimeoutMinutes:
    Type: Number
    Default: 60
    MinValue: 1
  CatalogBucketName:
    Type: String
  InputBucketName:
    Type: String
  EphemeralBucketName:
    Type: String
  CatalogPrefix:
    Type: String
    Default: evidence
  EphemeralPrefix:
    Type: String
    Default: deploy/tmp/r
  PythonStackName:
    Type: String
    Default: cyber-scanner-dev-python-ecs
  RStackName:
    Type: String
    Default: cyber-scanner-dev-r-ecs
  ContainerPort:
    Type: Number
    Default: 8000
  DesiredCount:
    Type: Number
    Default: 0
  TaskCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
  TaskMemory:
    Type: String
    Default: '2048'
  WebappImageUri:
    Type: String
    Default: public.ecr.aws/docker/library/python:3.12-slim

Conditions:
  HasTlsCertificate: !Not [!Equals [!Ref TlsCertificateArn, '']]
  HasCustomDomainName: !Not [!Equals [!Ref CustomDomainName, '']]
  HasCustomHostedZoneId: !Not [!Equals [!Ref CustomDomainHostedZoneId, '']]
  HasCustomDomain: !And
    - !Condition HasCustomDomainName
    - !Condition HasCustomHostedZoneId
  RuntimeEnabledCondition: !Equals [!Ref RuntimeEnabled, 'true']
  RuntimeWithTls: !And
    - !Condition RuntimeEnabledCondition
    - !Condition HasTlsCertificate
  RuntimeWithCustomDomain: !And
    - !Condition RuntimeEnabledCondition
    - !Condition HasCustomDomain

Resources:
  WebappSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentName} package scanner webapp service'
      VpcId: !Ref VpcId

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentName} package scanner webapp ALB'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
        - !If
          - HasTlsCertificate
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref AllowedIngressCidr
          - !Ref AWS::NoValue

  WebappSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebappSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  WebappLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}/webapp'
      RetentionInDays: 14

  WebappRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}/webapp'
      ImageScanningConfiguration:
        ScanOnPush: true

  WebappCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-webapp'

  WebappRuntimeLeaseParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${EnvironmentName}/webapp/runtime-lease-until'
      Type: String
      Value: '1970-01-01T00:00:00Z'
      Tier: Standard

  WebappTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  WebappTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WebappDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${InputBucketName}'
                  - !Sub 'arn:aws:s3:::${CatalogBucketName}'
                  - !Sub 'arn:aws:s3:::${EphemeralBucketName}'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${InputBucketName}/*'
                  - !Sub 'arn:aws:s3:::${CatalogBucketName}/*'
                  - !Sub 'arn:aws:s3:::${EphemeralBucketName}/*'
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeTasks
                Resource: '*'
              - Effect: Allow
                Action:
                  - states:ListExecutions
                  - states:DescribeExecution
                  - states:GetExecutionHistory
                  - states:StartExecution
                  - states:StopExecution
                Resource: '*'

  WebappRuntimeControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WebappRuntimeController
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action:
                  - ecs:CreateService
                  - ecs:DeleteService
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:TagResource
                  - ecs:UntagResource
                Resource: '*'
              - Effect: Allow
                Action:
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                Resource: '*'
              - Effect: Allow
                Action:
                  - states:ListExecutions
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeSecurityGroups
                  - ecr:DescribeRepositories
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt WebappTaskExecutionRole.Arn
                  - !GetAtt WebappTaskRole.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/webapp/runtime-lease-until'

  WebappRuntimeController:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-webapp-runtime-controller'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt WebappRuntimeControllerRole.Arn
      Timeout: 60
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          PYTHON_STACK_NAME: !Ref PythonStackName
          R_STACK_NAME: !Ref RStackName
          IDLE_TIMEOUT_MINUTES: !Ref IdleTimeoutMinutes
          RUNTIME_LEASE_PARAMETER: !Ref WebappRuntimeLeaseParameter
      Code:
        ZipFile: !Sub |
          import boto3
          import json
          import os
          from datetime import datetime, timedelta, timezone

          cloudformation = boto3.client("cloudformation")
          ssm = boto3.client("ssm")
          stepfunctions = boto3.client("stepfunctions")

          STACK_NAME = os.environ["STACK_NAME"]
          PYTHON_STACK_NAME = os.environ["PYTHON_STACK_NAME"]
          R_STACK_NAME = os.environ["R_STACK_NAME"]
          IDLE_TIMEOUT_MINUTES = int(os.environ.get("IDLE_TIMEOUT_MINUTES", "60"))
          RUNTIME_LEASE_PARAMETER = os.environ["RUNTIME_LEASE_PARAMETER"]

          TERMINAL_STATUSES = ("SUCCEEDED", "FAILED", "TIMED_OUT", "ABORTED")

          def parse_stack_parameters(stack):
              return {item["ParameterKey"]: item["ParameterValue"] for item in stack.get("Parameters", [])}

          def describe_stack(stack_name):
              return cloudformation.describe_stacks(StackName=stack_name)["Stacks"][0]

          def stack_in_progress(stack):
              return str(stack.get("StackStatus", "")).endswith("_IN_PROGRESS")

          def configured_state_machine_arns():
              arns = []
              for stack_name, keys in (
                  (PYTHON_STACK_NAME, ("PythonScanOrchestrationStateMachineArn", "PythonLinuxScanOrchestrationStateMachineArn")),
                  (R_STACK_NAME, ("RScanOrchestrationStateMachineArn", "RLinuxScanOrchestrationStateMachineArn", "RWindowsScanOrchestrationStateMachineArn")),
              ):
                  try:
                      stack = describe_stack(stack_name)
                  except Exception:
                      continue
                  outputs = {item["OutputKey"]: item["OutputValue"] for item in stack.get("Outputs", [])}
                  for key in keys:
                      value = str(outputs.get(key, "")).strip()
                      if value and value not in arns and value != "None":
                          arns.append(value)
              return arns

          def any_running(arns):
              for arn in arns:
                  executions = stepfunctions.list_executions(
                      stateMachineArn=arn,
                      statusFilter="RUNNING",
                      maxResults=5,
                  ).get("executions", [])
                  if executions:
                      return True
              return False

          def latest_completed_at(arns):
              latest = None
              for arn in arns:
                  for status in TERMINAL_STATUSES:
                      executions = stepfunctions.list_executions(
                          stateMachineArn=arn,
                          statusFilter=status,
                          maxResults=5,
                      ).get("executions", [])
                      for execution in executions:
                          stop_date = execution.get("stopDate")
                          if stop_date is None:
                              continue
                          if latest is None or stop_date > latest:
                              latest = stop_date
              return latest

          def get_manual_lease_until():
              try:
                  value = ssm.get_parameter(Name=RUNTIME_LEASE_PARAMETER)["Parameter"]["Value"].strip()
              except Exception:
                  return None
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None

          def set_manual_lease_until(lease_until):
              value = (
                  lease_until.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")
                  if lease_until
                  else "1970-01-01T00:00:00Z"
              )
              ssm.put_parameter(Name=RUNTIME_LEASE_PARAMETER, Value=value, Overwrite=True)

          def update_runtime(stack, runtime_enabled, desired_count, overrides=None):
              overrides = overrides or {}
              parameters = []
              for item in stack.get("Parameters", []):
                  key = item["ParameterKey"]
                  if key == "RuntimeEnabled":
                      parameters.append({"ParameterKey": key, "ParameterValue": "true" if runtime_enabled else "false"})
                  elif key == "DesiredCount":
                      parameters.append({"ParameterKey": key, "ParameterValue": str(desired_count)})
                  elif key in overrides:
                      parameters.append({"ParameterKey": key, "ParameterValue": str(overrides[key])})
                  else:
                      parameters.append({"ParameterKey": key, "UsePreviousValue": True})
              cloudformation.update_stack(
                  StackName=STACK_NAME,
                  UsePreviousTemplate=True,
                  Capabilities=["CAPABILITY_NAMED_IAM"],
                  Parameters=parameters,
              )

          def handler(event, context):
              event = event or {}
              action = str(event.get("action") or "reconcile").strip().lower()
              now = datetime.now(timezone.utc)

              stack = describe_stack(STACK_NAME)
              if stack_in_progress(stack):
                  return {"status": "stack-update-in-progress", "stack_status": stack.get("StackStatus")}

              params = parse_stack_parameters(stack)
              current_runtime = str(params.get("RuntimeEnabled", "false")).lower() == "true"
              current_desired = int(str(params.get("DesiredCount", "0") or "0"))
              overrides = {}

              if action == "enable":
                  lease_minutes = int(event.get("lease_minutes") or IDLE_TIMEOUT_MINUTES)
                  custom_domain_name = str(event.get("custom_domain_name") or "").strip()
                  custom_domain_hosted_zone_id = str(event.get("custom_domain_hosted_zone_id") or "").strip()
                  tls_certificate_arn = str(event.get("tls_certificate_arn") or "").strip()
                  clear_custom_domain = bool(event.get("clear_custom_domain"))
                  clear_tls_certificate = bool(event.get("clear_tls_certificate"))

                  if custom_domain_name and not custom_domain_hosted_zone_id:
                      return {"status": "invalid-request", "message": "custom_domain_hosted_zone_id is required when custom_domain_name is set"}
                  if custom_domain_hosted_zone_id and not custom_domain_name:
                      return {"status": "invalid-request", "message": "custom_domain_name is required when custom_domain_hosted_zone_id is set"}
                  if clear_custom_domain and (custom_domain_name or custom_domain_hosted_zone_id):
                      return {"status": "invalid-request", "message": "clear_custom_domain cannot be combined with custom_domain_name/custom_domain_hosted_zone_id"}
                  if clear_tls_certificate and tls_certificate_arn:
                      return {"status": "invalid-request", "message": "clear_tls_certificate cannot be combined with tls_certificate_arn"}

                  if clear_custom_domain:
                      overrides["CustomDomainName"] = ""
                      overrides["CustomDomainHostedZoneId"] = ""
                  elif custom_domain_name:
                      overrides["CustomDomainName"] = custom_domain_name
                      overrides["CustomDomainHostedZoneId"] = custom_domain_hosted_zone_id

                  if clear_tls_certificate:
                      overrides["TlsCertificateArn"] = ""
                  elif tls_certificate_arn:
                      overrides["TlsCertificateArn"] = tls_certificate_arn

                  set_manual_lease_until(now + timedelta(minutes=lease_minutes))
                  desired_runtime = True
              elif action == "disable":
                  set_manual_lease_until(None)
                  desired_runtime = False
              else:
                  arns = configured_state_machine_arns()
                  if any_running(arns):
                      desired_runtime = True
                  else:
                      desired_runtime = False
                      latest_completed = latest_completed_at(arns)
                      if latest_completed and now - latest_completed <= timedelta(minutes=IDLE_TIMEOUT_MINUTES):
                          desired_runtime = True
                      lease_until = get_manual_lease_until()
                      if lease_until and lease_until > now:
                          desired_runtime = True

              desired_count = 1 if desired_runtime else 0
              if current_runtime == desired_runtime and current_desired == desired_count and not overrides:
                  return {
                      "status": "no-change",
                      "runtime_enabled": current_runtime,
                      "desired_count": current_desired,
                  }

              update_runtime(stack, desired_runtime, desired_count, overrides)
              return {
                  "status": "update-started",
                  "runtime_enabled": desired_runtime,
                  "desired_count": desired_count,
                  "overrides": overrides,
              }

  WebappRuntimeControllerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-webapp-runtime-controller'
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt WebappRuntimeController.Arn
          Id: reconcile
          Input: '{"action":"reconcile"}'

  WebappRuntimeControllerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebappRuntimeController
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WebappRuntimeControllerSchedule.Arn

  WebappTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-webapp'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt WebappTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt WebappTaskRole.Arn
      ContainerDefinitions:
        - Name: webapp
          Image: !Ref WebappImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CATALOG_BUCKET
              Value: !Ref CatalogBucketName
            - Name: CATALOG_PREFIX
              Value: !Ref CatalogPrefix
            - Name: EPHEMERAL_BUCKET
              Value: !Ref EphemeralBucketName
            - Name: EPHEMERAL_PREFIX
              Value: !Ref EphemeralPrefix
            - Name: PYTHON_STACK_NAME
              Value: !Ref PythonStackName
            - Name: R_STACK_NAME
              Value: !Ref RStackName
            - Name: WEBAPP_PUBLIC_BASE_URL
              Value: !If
                - HasCustomDomain
                - !If
                  - HasTlsCertificate
                  - !Sub 'https://${CustomDomainName}'
                  - !Sub 'http://${CustomDomainName}'
                - ''
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebappLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: webapp

  WebappLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: RuntimeEnabledCondition
    Properties:
      Name: !Sub '${EnvironmentName}-webapp'
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref SubnetIds
      Type: application

  WebappTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: RuntimeEnabledCondition
    Properties:
      Name: !Sub '${EnvironmentName}-webapp'
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      Matcher:
        HttpCode: '200'

  WebappHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: RuntimeEnabledCondition
    Properties:
      LoadBalancerArn: !Ref WebappLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasTlsCertificate
          - Type: redirect
            RedirectConfig:
              Port: '443'
              Protocol: HTTPS
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref WebappTargetGroup

  WebappHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: RuntimeWithTls
    Properties:
      LoadBalancerArn: !Ref WebappLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref TlsCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebappTargetGroup

  WebappService:
    Type: AWS::ECS::Service
    Condition: RuntimeEnabledCondition
    DependsOn:
      - WebappHttpListener
    Properties:
      Cluster: !Ref WebappCluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref WebappTaskDefinition
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref WebappSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - TargetGroupArn: !Ref WebappTargetGroup
          ContainerName: webapp
          ContainerPort: !Ref ContainerPort

  WebappDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: RuntimeWithCustomDomain
    Properties:
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebappLoadBalancer.DNSName
        HostedZoneId: !GetAtt WebappLoadBalancer.CanonicalHostedZoneID

Outputs:
  WebappUrl:
    Value: !If
      - HasCustomDomain
      - !If
        - HasTlsCertificate
        - !Sub 'https://${CustomDomainName}'
        - !Sub 'http://${CustomDomainName}'
      - !If
        - RuntimeWithTls
        - !Sub 'https://${WebappLoadBalancer.DNSName}'
        - !If
          - RuntimeEnabledCondition
          - !Sub 'http://${WebappLoadBalancer.DNSName}'
          - ''
  WebappClusterArn:
    Value: !GetAtt WebappCluster.Arn
  WebappControllerFunctionName:
    Value: !Ref WebappRuntimeController
  WebappRuntimeLeaseParameterName:
    Value: !Ref WebappRuntimeLeaseParameter
  WebappServiceName:
    Value: !If
      - RuntimeEnabledCondition
      - !Ref WebappService
      - ''
  WebappRepositoryUri:
    Value: !GetAtt WebappRepository.RepositoryUri
  WebappLogGroupName:
    Value: !Ref WebappLogGroup
