                - pip install --no-cache-dir --upgrade pip
                - TRIVY_ARCHIVE="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
                - if ! aws s3 cp "s3://${EVIDENCE_BUCKET}/config/trivy/${TRIVY_ARCHIVE}" "/tmp/${TRIVY_ARCHIVE}" >/dev/null 2>&1; then curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "${TRIVY_RELEASE_BASE_URL}/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" -o "/tmp/${TRIVY_ARCHIVE}"; fi
                - if ! aws s3 cp "s3://${EVIDENCE_BUCKET}/config/trivy/trivy_${TRIVY_VERSION}_checksums.txt" /tmp/trivy_checksums.txt >/dev/null 2>&1; then curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "${TRIVY_RELEASE_BASE_URL}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt; fi
                - cd /tmp && grep " ${TRIVY_ARCHIVE}$" /tmp/trivy_checksums.txt | tr -d '\r' | sha256sum -c -
                - tar -xzf "/tmp/${TRIVY_ARCHIVE}" -C /tmp trivy
                - install -m 0755 /tmp/trivy /usr/local/bin/trivy
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${R_GOVERNANCE_SCRIPT_S3_KEY}" /tmp/generate-r-governance-artifacts.py
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${R_SBOM_SCRIPT_S3_KEY}" /tmp/generate-r-sbom.py
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${R_MATERIALIZE_SCRIPT_S3_KEY}" /tmp/materialize-r-environment.R
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${R_INSTALL_RUNTIME_SCRIPT_S3_KEY}" /tmp/install-r-runtime.sh
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${BUNDLE_SCRIPT_S3_KEY}" /tmp/bundle-directory.py
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${R_MATERIALIZATION_SUMMARY_SCRIPT_S3_KEY}" /tmp/generate-r-materialization-summary.py
                - chmod +x /tmp/install-r-runtime.sh
            build:
              commands:
                - set -euo pipefail
                - TS="${SCAN_TIMESTAMP:-$(date -u +%Y%m%dT%H%M%SZ)}"
                - TARGET_PLATFORM="linux-arm64"
                - RUN_DIR="/tmp/scan-out/${TS}"
                - PROJECT_DIR="${RUN_DIR}/project"
                - CACHE_DIR="${RUN_DIR}/cache"
                - mkdir -p "${RUN_DIR}" "${PROJECT_DIR}" "${CACHE_DIR}"
                - aws s3 cp "s3://${INPUT_BUCKET}/${INPUT_OBJECT_KEY}" /tmp/scan-input/renv.lock
                - cp /tmp/scan-input/renv.lock "${RUN_DIR}/renv.lock"
                - R_VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8-sig"))["R"]["Version"])' /tmp/scan-input/renv.lock)"
                - /tmp/install-r-runtime.sh --r-version "${R_VERSION}"
                - export PATH="/opt/R/${R_VERSION}/bin:${PATH}"
                - Rscript /tmp/materialize-r-environment.R --lock-file "${RUN_DIR}/renv.lock" --project-dir "${PROJECT_DIR}" --cache-dir "${CACHE_DIR}" --output-dir "${RUN_DIR}" --platform "${TARGET_PLATFORM}"
                - LIBRARY_PATH="$(cat "${RUN_DIR}/library-path.txt")"
                - python /tmp/bundle-directory.py --source-dir "${CACHE_DIR}" --output-file "${RUN_DIR}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz" --checksum-file "${RUN_DIR}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz.sha256"
                - python /tmp/bundle-directory.py --source-dir "${LIBRARY_PATH}" --output-file "${RUN_DIR}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz" --checksum-file "${RUN_DIR}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz.sha256"
                - python /tmp/generate-r-materialization-summary.py --run-dir "${RUN_DIR}" --platform "${TARGET_PLATFORM}" --r-version "${R_VERSION}" --cache-dir "${CACHE_DIR}" --library-path "${LIBRARY_PATH}"
                - python /tmp/generate-r-sbom.py --installed-packages-file "${RUN_DIR}/installed-packages.csv" --out-file "${RUN_DIR}/r-packages.cdx.json"
                - trivy sbom --format json --output "${RUN_DIR}/trivy-sbom-report.json" "${RUN_DIR}/r-packages.cdx.json" || true
                - GOVERNANCE_EXIT=0
                - python /tmp/generate-r-governance-artifacts.py --run-dir "${RUN_DIR}" --platform "${TARGET_PLATFORM}" --remediate-medium "${REMEDIATE_MEDIUM:-true}" --fail-on-medium "${FAIL_ON_MEDIUM:-false}" || GOVERNANCE_EXIT=$?
                - tar -czf "${RUN_DIR}/environment-artifacts.tar.gz" -C "${RUN_DIR}" renv.lock installed-packages.csv session-info.txt renv-status.txt materialization-summary.json r-packages.cdx.json || true
                - aws s3 cp "${RUN_DIR}/" "s3://${EPHEMERAL_BUCKET}/${EPHEMERAL_PREFIX}/${TARGET_PLATFORM}/${TS}/" --recursive
                - aws s3 cp "${RUN_DIR}/renv.lock" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/r/${TARGET_PLATFORM}/${TS}/renv.lock"
                - if [ -f "${RUN_DIR}/approval-candidate-packages.csv" ]; then aws s3 cp "${RUN_DIR}/approval-candidate-packages.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/r/${TARGET_PLATFORM}/${TS}/approval-candidate-packages.csv"; fi
                - if [ -f "${RUN_DIR}/installed-packages.csv" ]; then aws s3 cp "${RUN_DIR}/installed-packages.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/r/${TARGET_PLATFORM}/${TS}/installed-packages.csv"; fi
                - if [ -f "${RUN_DIR}/r-packages.cdx.json" ]; then aws s3 cp "${RUN_DIR}/r-packages.cdx.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/r/${TARGET_PLATFORM}/${TS}/r-packages.cdx.json"; fi
                - if [ -f "${RUN_DIR}/session-info.txt" ]; then aws s3 cp "${RUN_DIR}/session-info.txt" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/r/${TARGET_PLATFORM}/${TS}/session-info.txt"; fi
                - if [ -f "${RUN_DIR}/renv-status.txt" ]; then aws s3 cp "${RUN_DIR}/renv-status.txt" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/r/${TARGET_PLATFORM}/${TS}/renv-status.txt"; fi
                - if [ -f "${RUN_DIR}/restore.log" ]; then aws s3 cp "${RUN_DIR}/restore.log" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/r/${TARGET_PLATFORM}/${TS}/restore.log"; fi
                - if [ -f "${RUN_DIR}/materialization-summary.json" ]; then aws s3 cp "${RUN_DIR}/materialization-summary.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/traceability/r/${TARGET_PLATFORM}/${TS}/materialization-summary.json"; fi
                - if [ -f "${RUN_DIR}/environment-artifacts.tar.gz" ]; then aws s3 cp "${RUN_DIR}/environment-artifacts.tar.gz" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/r/${TARGET_PLATFORM}/${TS}/environment-artifacts.tar.gz"; fi
                - if [ -f "${RUN_DIR}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz" ]; then aws s3 cp "${RUN_DIR}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/r/${TARGET_PLATFORM}/${TS}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz"; fi
                - if [ -f "${RUN_DIR}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz.sha256" ]; then aws s3 cp "${RUN_DIR}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz.sha256" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/r/${TARGET_PLATFORM}/${TS}/renv-library-${TARGET_PLATFORM}-${TS}.tar.gz.sha256"; fi
                - if [ -f "${RUN_DIR}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz" ]; then aws s3 cp "${RUN_DIR}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/packages/offline/r/${TARGET_PLATFORM}/${TS}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz"; fi
                - if [ -f "${RUN_DIR}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz.sha256" ]; then aws s3 cp "${RUN_DIR}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz.sha256" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/packages/offline/r/${TARGET_PLATFORM}/${TS}/renv-cache-${TARGET_PLATFORM}-${TS}.tar.gz.sha256"; fi
                - if [ -f "${RUN_DIR}/trivy-sbom-report.json" ]; then aws s3 cp "${RUN_DIR}/trivy-sbom-report.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/model-results/r/${TARGET_PLATFORM}/${TS}/trivy-sbom-report.json"; fi
                - if [ -f "${RUN_DIR}/vulnerability-findings.csv" ]; then aws s3 cp "${RUN_DIR}/vulnerability-findings.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/r/${TARGET_PLATFORM}/${TS}/vulnerability-findings.csv"; fi
                - if [ -f "${RUN_DIR}/remediation-required.csv" ]; then aws s3 cp "${RUN_DIR}/remediation-required.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/r/${TARGET_PLATFORM}/${TS}/remediation-required.csv"; fi
                - if [ -f "${RUN_DIR}/remediation-exceptions.csv" ]; then aws s3 cp "${RUN_DIR}/remediation-exceptions.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/r/${TARGET_PLATFORM}/${TS}/remediation-exceptions.csv"; fi
                - if [ -f "${RUN_DIR}/remediation-spreadsheet.csv" ]; then aws s3 cp "${RUN_DIR}/remediation-spreadsheet.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/r/${TARGET_PLATFORM}/${TS}/remediation-spreadsheet.csv"; fi
                - if [ -f "${RUN_DIR}/governance-summary.json" ]; then aws s3 cp "${RUN_DIR}/governance-summary.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/traceability/r/${TARGET_PLATFORM}/${TS}/governance-summary.json"; fi
                - printf '{"platform":"%s","timestamp_utc":"%s","scan_execution_id":"%s","r_version":"%s","ephemeral_prefix":"%s/%s/%s","offline_bundle_prefix":"%s/packages/offline/r/%s/%s","cleanup":"requested"}' "${TARGET_PLATFORM}" "${TS}" "${SCAN_EXECUTION_ID:-manual}" "${R_VERSION}" "${EPHEMERAL_PREFIX}" "${TARGET_PLATFORM}" "${TS}" "${EVIDENCE_PREFIX}" "${TARGET_PLATFORM}" "${TS}" > "${RUN_DIR}/run-metadata.json"
                - aws s3 cp "${RUN_DIR}/run-metadata.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/traceability/r/${TARGET_PLATFORM}/${TS}/run-metadata.json"
                - aws s3 rm "s3://${EPHEMERAL_BUCKET}/${EPHEMERAL_PREFIX}/${TARGET_PLATFORM}/${TS}/" --recursive
                - if [ "${GOVERNANCE_EXIT}" -ne 0 ]; then echo "Governance gate failed with exit ${GOVERNANCE_EXIT}"; exit "${GOVERNANCE_EXIT}"; fi
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: !Ref LinuxArmComputeType
        EnvironmentVariables:
          - Name: INPUT_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateInputBucket, !Ref InputBucket, !Ref ExistingInputBucketName]
          - Name: INPUT_OBJECT_KEY
            Type: PLAINTEXT
            Value: inputs/r/renv.lock
          - Name: EVIDENCE_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEvidenceBucket, !Ref EvidenceBucket, !Ref ExistingEvidenceBucketName]
          - Name: EVIDENCE_PREFIX
            Type: PLAINTEXT
            Value: evidence
          - Name: EPHEMERAL_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEphemeralBucket, !Ref EphemeralBucket, !Ref ExistingEphemeralBucketName]
          - Name: EPHEMERAL_PREFIX
            Type: PLAINTEXT
            Value: deploy/tmp/r
          - Name: REMEDIATE_MEDIUM
            Type: PLAINTEXT
            Value: 'true'
          - Name: FAIL_ON_MEDIUM
            Type: PLAINTEXT
            Value: 'false'
          - Name: R_GOVERNANCE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-r-governance-artifacts.py
          - Name: R_SBOM_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-r-sbom.py
          - Name: R_MATERIALIZE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/materialize-r-environment.R
          - Name: R_INSTALL_RUNTIME_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/install-r-runtime.sh
          - Name: BUNDLE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/bundle-directory.py
          - Name: R_MATERIALIZATION_SUMMARY_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-r-materialization-summary.py
          - Name: TRIVY_VERSION
            Type: PLAINTEXT
            Value: !Ref TrivyVersion
          - Name: TRIVY_RELEASE_BASE_URL
            Type: PLAINTEXT
            Value: !Ref TrivyReleaseBaseUrl

  RWindowsAmd64Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${EnvironmentName}-r-scan-windows-amd64'
      ServiceRole: !GetAtt ScanBuildRole.Arn
      TimeoutInMinutes: !Ref BuildTimeoutMinutes
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: powershell
          phases:
            install:
              commands:
                - New-Item -ItemType Directory -Force -Path C:\scan-input, C:\scan-out | Out-Null
                - $rtoolsRoot = 'C:\rtools44'
                - if (-not (Test-Path $rtoolsRoot)) {
                    $rtoolsInstaller = 'C:\rtools.exe';
                    Invoke-WebRequest -Uri 'https://cloud.r-project.org/bin/windows/Rtools/rtools44.exe' -OutFile $rtoolsInstaller;
                    Start-Process -FilePath $rtoolsInstaller -ArgumentList '/VERYSILENT','/DIR=C:\rtools44' -Wait;
                  }
                - $env:PATH = "C:\rtools44\usr\bin;C:\rtools44\mingw64\bin;$env:PATH"
                - python -m pip install --upgrade pip
                - aws s3 cp "s3://${env:EVIDENCE_BUCKET}/${env:R_GOVERNANCE_SCRIPT_S3_KEY}" C:\generate-r-governance-artifacts.py
                - aws s3 cp "s3://${env:EVIDENCE_BUCKET}/${env:R_SBOM_SCRIPT_S3_KEY}" C:\generate-r-sbom.py
                - aws s3 cp "s3://${env:EVIDENCE_BUCKET}/${env:R_MATERIALIZE_SCRIPT_S3_KEY}" C:\materialize-r-environment.R
                - aws s3 cp "s3://${env:EVIDENCE_BUCKET}/${env:R_INSTALL_RUNTIME_SCRIPT_S3_KEY}" C:\install-r-runtime.ps1
                - aws s3 cp "s3://${env:EVIDENCE_BUCKET}/${env:BUNDLE_SCRIPT_S3_KEY}" C:\bundle-directory.py
                - aws s3 cp "s3://${env:EVIDENCE_BUCKET}/${env:R_MATERIALIZATION_SUMMARY_SCRIPT_S3_KEY}" C:\generate-r-materialization-summary.py
                - $trivyArchive = "trivy_${env:TRIVY_VERSION}_windows-64bit.zip"
                - $ok = $false; try { aws s3 cp "s3://${env:EVIDENCE_BUCKET}/config/trivy/$trivyArchive" C:\trivy.zip 2>$null; if ($LASTEXITCODE -eq 0) { $ok = $true } } catch {}
                - if (-not $ok) { Invoke-WebRequest -Uri "${env:TRIVY_RELEASE_BASE_URL}/v${env:TRIVY_VERSION}/$trivyArchive" -OutFile C:\trivy.zip }
                - Expand-Archive -Path C:\trivy.zip -DestinationPath C:\trivy -Force
            build:
              commands:
                - Write-Host 'Build phase starting'
                - $ts = if ($env:SCAN_TIMESTAMP) { $env:SCAN_TIMESTAMP } else { (Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmssZ') }
                - $platform = 'windows-amd64'
                - $runDir = "C:\scan-out\$ts"
                - $projectDir = "$runDir\project"
                - $cacheDir = "$runDir\cache"
                - New-Item -ItemType Directory -Force -Path $runDir, $projectDir, $cacheDir | Out-Null
                - aws s3 cp "s3://${env:INPUT_BUCKET}/${env:INPUT_OBJECT_KEY}" C:\scan-input\renv.lock
                - Copy-Item C:\scan-input\renv.lock "$runDir\renv.lock" -Force
                - $rVersion = ((Get-Content C:\scan-input\renv.lock -Raw | ConvertFrom-Json).R.Version)
                - powershell -ExecutionPolicy Bypass -File C:\install-r-runtime.ps1 -RVersion $rVersion
                - >-
                  $env:PATH = "C:\R\R-$rVersion\bin;C:\rtools44\usr\bin;C:\rtools44\mingw64\bin;$env:PATH"
                - >-
                  & "C:\R\R-$rVersion\bin\Rscript.exe" C:\materialize-r-environment.R --lock-file "$runDir\renv.lock" --project-dir $projectDir --cache-dir $cacheDir --output-dir $runDir --platform $platform
                - $libraryPath = (Get-Content "$runDir\library-path.txt" -Raw).Trim()
                - python C:\bundle-directory.py --source-dir $cacheDir --output-file "$runDir\renv-cache-$platform-$ts.tar.gz" --checksum-file "$runDir\renv-cache-$platform-$ts.tar.gz.sha256"
                - python C:\bundle-directory.py --source-dir $libraryPath --output-file "$runDir\renv-library-$platform-$ts.tar.gz" --checksum-file "$runDir\renv-library-$platform-$ts.tar.gz.sha256"
                - python C:\generate-r-materialization-summary.py --run-dir $runDir --platform $platform --r-version $rVersion --cache-dir $cacheDir --library-path $libraryPath
                - python C:\generate-r-sbom.py --installed-packages-file "$runDir\installed-packages.csv" --out-file "$runDir\r-packages.cdx.json"
                - C:\trivy\trivy.exe sbom --format json --output "$runDir\trivy-sbom-report.json" "$runDir\r-packages.cdx.json"; $true
                - $govExit = 0
                - python C:\generate-r-governance-artifacts.py --run-dir $runDir --platform $platform --remediate-medium $env:REMEDIATE_MEDIUM --fail-on-medium $env:FAIL_ON_MEDIUM; if ($LASTEXITCODE -ne 0) { $govExit = $LASTEXITCODE }
                - try { tar -czf "$runDir\environment-artifacts.tar.gz" -C $runDir renv.lock installed-packages.csv session-info.txt renv-status.txt materialization-summary.json r-packages.cdx.json } catch { Write-Host 'archive step skipped' }
                - aws s3 cp "$runDir\" "s3://${env:EPHEMERAL_BUCKET}/${env:EPHEMERAL_PREFIX}/$platform/$ts/" --recursive
                - aws s3 cp "$runDir\renv.lock" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/requirements/r/$platform/$ts/renv.lock"
                - if (Test-Path "$runDir\approval-candidate-packages.csv") { aws s3 cp "$runDir\approval-candidate-packages.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/requirements/r/$platform/$ts/approval-candidate-packages.csv" }
                - if (Test-Path "$runDir\installed-packages.csv") { aws s3 cp "$runDir\installed-packages.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/requirements/r/$platform/$ts/installed-packages.csv" }
                - if (Test-Path "$runDir\r-packages.cdx.json") { aws s3 cp "$runDir\r-packages.cdx.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/r/$platform/$ts/r-packages.cdx.json" }
                - if (Test-Path "$runDir\session-info.txt") { aws s3 cp "$runDir\session-info.txt" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/r/$platform/$ts/session-info.txt" }
                - if (Test-Path "$runDir\renv-status.txt") { aws s3 cp "$runDir\renv-status.txt" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/r/$platform/$ts/renv-status.txt" }
                - if (Test-Path "$runDir\restore.log") { aws s3 cp "$runDir\restore.log" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/r/$platform/$ts/restore.log" }
                - if (Test-Path "$runDir\materialization-summary.json") { aws s3 cp "$runDir\materialization-summary.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/traceability/r/$platform/$ts/materialization-summary.json" }
                - if (Test-Path "$runDir\environment-artifacts.tar.gz") { aws s3 cp "$runDir\environment-artifacts.tar.gz" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/r/$platform/$ts/environment-artifacts.tar.gz" }
                - if (Test-Path "$runDir\renv-library-$platform-$ts.tar.gz") { aws s3 cp "$runDir\renv-library-$platform-$ts.tar.gz" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/r/$platform/$ts/renv-library-$platform-$ts.tar.gz" }
                - if (Test-Path "$runDir\renv-library-$platform-$ts.tar.gz.sha256") { aws s3 cp "$runDir\renv-library-$platform-$ts.tar.gz.sha256" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/r/$platform/$ts/renv-library-$platform-$ts.tar.gz.sha256" }
                - if (Test-Path "$runDir\renv-cache-$platform-$ts.tar.gz") { aws s3 cp "$runDir\renv-cache-$platform-$ts.tar.gz" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/packages/offline/r/$platform/$ts/renv-cache-$platform-$ts.tar.gz" }
                - if (Test-Path "$runDir\renv-cache-$platform-$ts.tar.gz.sha256") { aws s3 cp "$runDir\renv-cache-$platform-$ts.tar.gz.sha256" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/packages/offline/r/$platform/$ts/renv-cache-$platform-$ts.tar.gz.sha256" }
                - if (Test-Path "$runDir\trivy-sbom-report.json") { aws s3 cp "$runDir\trivy-sbom-report.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/model-results/r/$platform/$ts/trivy-sbom-report.json" }
                - if (Test-Path "$runDir\vulnerability-findings.csv") { aws s3 cp "$runDir\vulnerability-findings.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/r/$platform/$ts/vulnerability-findings.csv" }
                - if (Test-Path "$runDir\remediation-required.csv") { aws s3 cp "$runDir\remediation-required.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/r/$platform/$ts/remediation-required.csv" }
                - if (Test-Path "$runDir\remediation-exceptions.csv") { aws s3 cp "$runDir\remediation-exceptions.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/r/$platform/$ts/remediation-exceptions.csv" }
                - if (Test-Path "$runDir\remediation-spreadsheet.csv") { aws s3 cp "$runDir\remediation-spreadsheet.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/r/$platform/$ts/remediation-spreadsheet.csv" }
                - if (Test-Path "$runDir\governance-summary.json") { aws s3 cp "$runDir\governance-summary.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/traceability/r/$platform/$ts/governance-summary.json" }
                - $metaJson = "{`"platform`":`"$platform`",`"timestamp_utc`":`"$ts`",`"scan_execution_id`":`"$($env:SCAN_EXECUTION_ID)`",`"r_version`":`"$rVersion`",`"ephemeral_prefix`":`"${env:EPHEMERAL_PREFIX}/$platform/$ts`",`"offline_bundle_prefix`":`"${env:EVIDENCE_PREFIX}/packages/offline/r/$platform/$ts`",`"cleanup`":`"requested`"}"; $metaJson | Out-File "$runDir\run-metadata.json" -Encoding ascii
                - aws s3 cp "$runDir\run-metadata.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/traceability/r/$platform/$ts/run-metadata.json"
                - aws s3 rm "s3://${env:EPHEMERAL_BUCKET}/${env:EPHEMERAL_PREFIX}/$platform/$ts/" --recursive
                - if ($govExit -ne 0) { Write-Host "Governance gate failed with exit $govExit"; exit $govExit }
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: WINDOWS_SERVER_2022_CONTAINER
        Image: aws/codebuild/windows-base:2022-1.0
        ComputeType: !Ref WindowsComputeType
        EnvironmentVariables:
          - Name: INPUT_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateInputBucket, !Ref InputBucket, !Ref ExistingInputBucketName]
          - Name: INPUT_OBJECT_KEY
            Type: PLAINTEXT
            Value: inputs/r/renv.lock
          - Name: EVIDENCE_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEvidenceBucket, !Ref EvidenceBucket, !Ref ExistingEvidenceBucketName]
          - Name: EVIDENCE_PREFIX
            Type: PLAINTEXT
            Value: evidence
          - Name: EPHEMERAL_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEphemeralBucket, !Ref EphemeralBucket, !Ref ExistingEphemeralBucketName]
          - Name: EPHEMERAL_PREFIX
            Type: PLAINTEXT
            Value: deploy/tmp/r
          - Name: REMEDIATE_MEDIUM
            Type: PLAINTEXT
            Value: 'true'
          - Name: FAIL_ON_MEDIUM
            Type: PLAINTEXT
            Value: 'false'
          - Name: R_GOVERNANCE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-r-governance-artifacts.py
          - Name: R_SBOM_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-r-sbom.py
          - Name: R_MATERIALIZE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/materialize-r-environment.R
          - Name: R_INSTALL_RUNTIME_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/install-r-runtime.ps1
          - Name: BUNDLE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/bundle-directory.py
          - Name: R_MATERIALIZATION_SUMMARY_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-r-materialization-summary.py
          - Name: TRIVY_VERSION
            Type: PLAINTEXT
            Value: !Ref TrivyVersion
          - Name: TRIVY_RELEASE_BASE_URL
            Type: PLAINTEXT
            Value: !Ref TrivyReleaseBaseUrl

  RScanSummaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-r-scan-summary-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: EvidenceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !If [CreateEvidenceBucket, !GetAtt EvidenceBucket.Arn, !Sub 'arn:aws:s3:::${ExistingEvidenceBucketName}']
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !If [CreateEvidenceBucket, !Sub '${EvidenceBucket.Arn}/*', !Sub 'arn:aws:s3:::${ExistingEvidenceBucketName}/*']
        - PolicyName: EventBridge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'

  RScanSummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-r-scan-summary'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt RScanSummaryRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")
          events = boto3.client("events")


          def head_exists(bucket, key):
              try:
                  s3.head_object(Bucket=bucket, Key=key)
                  return True
              except ClientError as exc:
                  if exc.response["Error"]["Code"] in {"404", "NoSuchKey", "NotFound"}:
                      return False
                  raise


          def list_keys(bucket, prefix):
              paginator = s3.get_paginator("list_objects_v2")
              keys = []
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  keys.extend(obj["Key"] for obj in page.get("Contents", []))
              return keys


          def handler(event, _context):
              bucket = event["evidence_bucket"]
              prefix = event.get("evidence_prefix", "evidence").rstrip("/")
              timestamp = event["scan_timestamp"]
              execution_id = event["scan_execution_id"]
              platforms = []
              overall = "SUCCEEDED"

              for result in event["results"]:
                  platform = result["platform"]
                  status = result["status"]
                  platform_summary = {
                      "platform": platform,
                      "status": status,
                      "build_id": result.get("buildId"),
                      "project_name": result.get("projectName"),
                      "validated": False,
                  }

                  if status == "SUCCEEDED":
                      required = [
                          f"{prefix}/requirements/r/{platform}/{timestamp}/renv.lock",
                          f"{prefix}/requirements/r/{platform}/{timestamp}/installed-packages.csv",
                          f"{prefix}/traceability/r/{platform}/{timestamp}/materialization-summary.json",
                          f"{prefix}/traceability/r/{platform}/{timestamp}/run-metadata.json",
                      ]
                      missing = [key for key in required if not head_exists(bucket, key)]
                      bundle_prefix = f"{prefix}/packages/offline/r/{platform}/{timestamp}/"
                      bundle_keys = list_keys(bucket, bundle_prefix)
                      tarballs = [key for key in bundle_keys if key.endswith(".tar.gz")]
                      checksums = [key for key in bundle_keys if key.endswith(".tar.gz.sha256")]
                      if not tarballs:
                          missing.append(f"{bundle_prefix}*.tar.gz")
                      if not checksums:
                          missing.append(f"{bundle_prefix}*.tar.gz.sha256")
                      platform_summary["bundle_keys"] = bundle_keys
                      platform_summary["missing"] = missing
                      platform_summary["validated"] = not missing
                      if missing:
                          overall = "FAILED"
                  else:
                      overall = "FAILED"
                      platform_summary["error"] = result.get("error")
                      platform_summary["cause"] = result.get("cause")

                  platforms.append(platform_summary)

              summary = {
                  "scan_execution_id": execution_id,
                  "scan_timestamp": timestamp,
                  "overall_status": overall,
                  "platforms": platforms,
              }
              summary_key = f"{prefix}/orchestration/r/{execution_id}/orchestration-summary.json"
              s3.put_object(
                  Bucket=bucket,
                  Key=summary_key,
                  Body=json.dumps(summary, indent=2).encode("utf-8"),
                  ContentType="application/json",
              )
              summary["summary_key"] = summary_key
              events.put_events(
                  Entries=[
                      {
                          "Source": "package-scanner.r",
                          "DetailType": f"R Materialization Orchestration {overall}",
                          "Detail": json.dumps(summary),
                      }
                  ]
              )
              return summary

  RScanOrchestrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-r-scan-orchestrator-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !GetAtt RLinuxAmd64Project.Arn
                  - !GetAtt RLinuxArm64Project.Arn
                  - !GetAtt RWindowsAmd64Project.Arn
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventForCodeBuildStartBuildRule'
        - PolicyName: InvokeSummary
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt RScanSummaryFunction.Arn

  RScanOrchestrationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${EnvironmentName}-r-scan-orchestrator'
      RoleArn: !GetAtt RScanOrchestrationRole.Arn
      DefinitionString: !Sub |
        {
          "StartAt": "RunBuilds",
          "States": {
            "RunBuilds": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "LinuxAmd64Build",
                  "States": {
                    "LinuxAmd64Build": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::codebuild:startBuild.sync",
                      "Parameters": {
                        "ProjectName": "${RLinuxAmd64Project}",
                        "EnvironmentVariablesOverride": [
                          { "Name": "INPUT_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.input_bucket" },
                          { "Name": "INPUT_OBJECT_KEY", "Type": "PLAINTEXT", "Value.$": "$.input_object_key" },
                          { "Name": "EVIDENCE_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.evidence_bucket" },
                          { "Name": "EVIDENCE_PREFIX", "Type": "PLAINTEXT", "Value.$": "$.evidence_prefix" },
                          { "Name": "EPHEMERAL_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.ephemeral_bucket" },
                          { "Name": "EPHEMERAL_PREFIX", "Type": "PLAINTEXT", "Value.$": "$.ephemeral_prefix" },
                          { "Name": "REMEDIATE_MEDIUM", "Type": "PLAINTEXT", "Value.$": "$.remediate_medium" },
                          { "Name": "FAIL_ON_MEDIUM", "Type": "PLAINTEXT", "Value.$": "$.fail_on_medium" },
                          { "Name": "SCAN_TIMESTAMP", "Type": "PLAINTEXT", "Value.$": "$.scan_timestamp" },
                          { "Name": "SCAN_EXECUTION_ID", "Type": "PLAINTEXT", "Value.$": "$.scan_execution_id" }
                        ]
                      },
                      "ResultSelector": {
                        "platform": "linux-amd64",
                        "status": "SUCCEEDED",
                        "projectName": "${RLinuxAmd64Project}",
                        "buildId.$": "$.Build.Id"
                      },
                      "Catch": [
                        {
                          "ErrorEquals": ["States.ALL"],
                          "ResultPath": "$.error",
                          "Next": "LinuxAmd64Failure"
                        }
                      ],
                      "End": true
                    },
                    "LinuxAmd64Failure": {
                      "Type": "Pass",
                      "Parameters": {
                        "platform": "linux-amd64",
                        "status": "FAILED",
                        "projectName": "${RLinuxAmd64Project}",
                        "error.$": "$.error.Error",
                        "cause.$": "$.error.Cause"
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "LinuxArm64Build",
                  "States": {
                    "LinuxArm64Build": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::codebuild:startBuild.sync",
                      "Parameters": {
                        "ProjectName": "${RLinuxArm64Project}",
                        "EnvironmentVariablesOverride": [
                          { "Name": "INPUT_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.input_bucket" },
                          { "Name": "INPUT_OBJECT_KEY", "Type": "PLAINTEXT", "Value.$": "$.input_object_key" },
                          { "Name": "EVIDENCE_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.evidence_bucket" },
                          { "Name": "EVIDENCE_PREFIX", "Type": "PLAINTEXT", "Value.$": "$.evidence_prefix" },
                          { "Name": "EPHEMERAL_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.ephemeral_bucket" },
                          { "Name": "EPHEMERAL_PREFIX", "Type": "PLAINTEXT", "Value.$": "$.ephemeral_prefix" },
                          { "Name": "REMEDIATE_MEDIUM", "Type": "PLAINTEXT", "Value.$": "$.remediate_medium" },
                          { "Name": "FAIL_ON_MEDIUM", "Type": "PLAINTEXT", "Value.$": "$.fail_on_medium" },
                          { "Name": "SCAN_TIMESTAMP", "Type": "PLAINTEXT", "Value.$": "$.scan_timestamp" },
                          { "Name": "SCAN_EXECUTION_ID", "Type": "PLAINTEXT", "Value.$": "$.scan_execution_id" }
                        ]
                      },
                      "ResultSelector": {
                        "platform": "linux-arm64",
                        "status": "SUCCEEDED",
                        "projectName": "${RLinuxArm64Project}",
                        "buildId.$": "$.Build.Id"
                      },
                      "Catch": [
                        {
                          "ErrorEquals": ["States.ALL"],
                          "ResultPath": "$.error",
                          "Next": "LinuxArm64Failure"
                        }
                      ],
                      "End": true
                    },
                    "LinuxArm64Failure": {
                      "Type": "Pass",
                      "Parameters": {
                        "platform": "linux-arm64",
                        "status": "FAILED",
                        "projectName": "${RLinuxArm64Project}",
                        "error.$": "$.error.Error",
                        "cause.$": "$.error.Cause"
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "WindowsAmd64Build",
                  "States": {
                    "WindowsAmd64Build": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::codebuild:startBuild.sync",
                      "Parameters": {
                        "ProjectName": "${RWindowsAmd64Project}",
                        "EnvironmentVariablesOverride": [
                          { "Name": "INPUT_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.input_bucket" },
                          { "Name": "INPUT_OBJECT_KEY", "Type": "PLAINTEXT", "Value.$": "$.input_object_key" },
                          { "Name": "EVIDENCE_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.evidence_bucket" },
                          { "Name": "EVIDENCE_PREFIX", "Type": "PLAINTEXT", "Value.$": "$.evidence_prefix" },
                          { "Name": "EPHEMERAL_BUCKET", "Type": "PLAINTEXT", "Value.$": "$.ephemeral_bucket" },
                          { "Name": "EPHEMERAL_PREFIX", "Type": "PLAINTEXT", "Value.$": "$.ephemeral_prefix" },
                          { "Name": "REMEDIATE_MEDIUM", "Type": "PLAINTEXT", "Value.$": "$.remediate_medium" },
                          { "Name": "FAIL_ON_MEDIUM", "Type": "PLAINTEXT", "Value.$": "$.fail_on_medium" },
                          { "Name": "SCAN_TIMESTAMP", "Type": "PLAINTEXT", "Value.$": "$.scan_timestamp" },
                          { "Name": "SCAN_EXECUTION_ID", "Type": "PLAINTEXT", "Value.$": "$.scan_execution_id" }
                        ]
                      },
                      "ResultSelector": {
                        "platform": "windows-amd64",
                        "status": "SUCCEEDED",
                        "projectName": "${RWindowsAmd64Project}",
                        "buildId.$": "$.Build.Id"
                      },
                      "Catch": [
                        {
                          "ErrorEquals": ["States.ALL"],
                          "ResultPath": "$.error",
                          "Next": "WindowsAmd64Failure"
                        }
                      ],
                      "End": true
                    },
                    "WindowsAmd64Failure": {
                      "Type": "Pass",
                      "Parameters": {
                        "platform": "windows-amd64",
                        "status": "FAILED",
                        "projectName": "${RWindowsAmd64Project}",
                        "error.$": "$.error.Error",
                        "cause.$": "$.error.Cause"
                      },
                      "End": true
                    }
                  }
                }
              ],
              "ResultPath": "$.results",
              "Next": "ValidateArtifacts"
            },
            "ValidateArtifacts": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "OutputPath": "$.Payload",
              "Parameters": {
                "FunctionName": "${RScanSummaryFunction.Arn}",
                "Payload": {
                  "scan_execution_id.$": "$.scan_execution_id",
                  "scan_timestamp.$": "$.scan_timestamp",
                  "evidence_bucket.$": "$.evidence_bucket",
                  "evidence_prefix.$": "$.evidence_prefix",
                  "results.$": "$.results"
                }
              },
              "Next": "ValidationResult"
            },
            "ValidationResult": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.overall_status",
                  "StringEquals": "SUCCEEDED",
                  "Next": "Done"
                }
              ],
              "Default": "ValidationFailed"
            },
            "Done": {
              "Type": "Succeed"
            },
            "ValidationFailed": {
              "Type": "Fail",
              "Error": "RScanValidationFailed",
              "Cause": "One or more platform builds failed or required artifacts were missing."
            }
          }
        }


Outputs:
  InputBucketName:
    Value: !If [CreateInputBucket, !Ref InputBucket, !Ref ExistingInputBucketName]
  EvidenceBucketName:
    Value: !If [CreateEvidenceBucket, !Ref EvidenceBucket, !Ref ExistingEvidenceBucketName]
  EphemeralBucketName:
    Value: !If [CreateEphemeralBucket, !Ref EphemeralBucket, !Ref ExistingEphemeralBucketName]
  LinuxAmd64ProjectName:
    Value: !Ref LinuxAmd64Project
  LinuxArm64ProjectName:
    Value: !Ref LinuxArm64Project
  WindowsAmd64ProjectName:
    Value: !Ref WindowsAmd64Project
  RLinuxAmd64ProjectName:
    Value: !Ref RLinuxAmd64Project
  RLinuxArm64ProjectName:
    Value: !Ref RLinuxArm64Project
  RWindowsAmd64ProjectName:
    Value: !Ref RWindowsAmd64Project
  RScanOrchestrationStateMachineArn:
    Value: !Ref RScanOrchestrationStateMachine
