      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: !Ref LinuxArmComputeType
        EnvironmentVariables:
          - Name: INPUT_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateInputBucket, !Ref InputBucket, !Ref ExistingInputBucketName]
          - Name: INPUT_OBJECT_KEY
            Type: PLAINTEXT
            Value: inputs/python/environment.yml
          - Name: EVIDENCE_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEvidenceBucket, !Ref EvidenceBucket, !Ref ExistingEvidenceBucketName]
          - Name: EVIDENCE_PREFIX
            Type: PLAINTEXT
            Value: evidence
          - Name: EPHEMERAL_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEphemeralBucket, !Ref EphemeralBucket, !Ref ExistingEphemeralBucketName]
          - Name: EPHEMERAL_PREFIX
            Type: PLAINTEXT
            Value: deploy/tmp/python
          - Name: ENABLE_FORTIFY
            Type: PLAINTEXT
            Value: 'false'
          - Name: FORTIFY_COMMAND
            Type: PLAINTEXT
            Value: ''
          - Name: REMEDIATE_MEDIUM
            Type: PLAINTEXT
            Value: 'true'
          - Name: FAIL_ON_MEDIUM
            Type: PLAINTEXT
            Value: 'false'
          - Name: GOVERNANCE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-governance-artifacts.py
          - Name: TRIVY_VERSION
            Type: PLAINTEXT
            Value: !Ref TrivyVersion
          - Name: TRIVY_RELEASE_BASE_URL
            Type: PLAINTEXT
            Value: !Ref TrivyReleaseBaseUrl

  WindowsAmd64Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${EnvironmentName}-python-scan-windows-amd64'
      ServiceRole: !GetAtt ScanBuildRole.Arn
      TimeoutInMinutes: !Ref BuildTimeoutMinutes
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: powershell
          phases:
            install:
              commands:
                - New-Item -ItemType Directory -Force -Path C:\scan-input, C:\scan-out | Out-Null
                - python -m pip install --upgrade pip
                - python -m pip install safety cyclonedx-bom
                - $trivyArchive = "trivy_${env:TRIVY_VERSION}_windows-64bit.zip"
                - $ok = $false; try { aws s3 cp "s3://${env:EVIDENCE_BUCKET}/config/trivy/$trivyArchive" C:\trivy.zip 2>$null; if ($LASTEXITCODE -eq 0) { $ok = $true } } catch {}
                - if (-not $ok) { Invoke-WebRequest -Uri "${env:TRIVY_RELEASE_BASE_URL}/v${env:TRIVY_VERSION}/$trivyArchive" -OutFile C:\trivy.zip }
                - Expand-Archive -Path C:\trivy.zip -DestinationPath C:\trivy -Force
                - Invoke-WebRequest -Uri https://micro.mamba.pm/api/micromamba/win-64/latest -OutFile C:\micromamba.tar.bz2
                - New-Item -ItemType Directory -Force -Path C:\mamba | Out-Null
                - tar -xjf C:\micromamba.tar.bz2 -C C:\mamba
                - aws s3 cp "s3://${env:EVIDENCE_BUCKET}/${env:GOVERNANCE_SCRIPT_S3_KEY}" C:\generate-governance-artifacts.py
            build:
              commands:
                - Write-Host 'Build phase starting'
                - $ts = (Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmssZ')
                - $platform = 'windows-amd64'
                - $runDir = "C:\scan-out\$ts"
                - New-Item -ItemType Directory -Force -Path $runDir | Out-Null
                - aws s3 cp "s3://${env:INPUT_BUCKET}/${env:INPUT_OBJECT_KEY}" C:\scan-input\environment.yml
                - Copy-Item C:\scan-input\environment.yml "$runDir\environment.yml" -Force
                - C:\mamba\Library\bin\micromamba.exe env create -f C:\scan-input\environment.yml -n target; if ($LASTEXITCODE -ne 0) { C:\mamba\Library\bin\micromamba.exe env update -f C:\scan-input\environment.yml -n target }
                - C:\mamba\Library\bin\micromamba.exe run -n target python -m pip list --format=freeze | Out-File "$runDir\requirements.lock.txt" -Encoding ascii
                - python -m cyclonedx_py requirements "$runDir\requirements.lock.txt" -o "$runDir\python-packages.cdx.json"
                - C:\trivy\trivy.exe sbom --format json --output "$runDir\trivy-sbom-report.json" "$runDir\python-packages.cdx.json"; $true
                - python -m safety scan --file "$runDir\requirements.lock.txt" --output json | Out-File "$runDir\safety-report.json" -Encoding ascii; $true
                - if ($env:ENABLE_FORTIFY -eq 'true' -and $env:FORTIFY_COMMAND) { cmd /c $env:FORTIFY_COMMAND | Out-File "$runDir\fortify-report.txt" -Encoding ascii }
                - $govExit = 0
                - python C:\generate-governance-artifacts.py --run-dir $runDir --platform $platform --remediate-medium $env:REMEDIATE_MEDIUM --fail-on-medium $env:FAIL_ON_MEDIUM; if ($LASTEXITCODE -ne 0) { $govExit = $LASTEXITCODE }
                - try { tar -czf "$runDir\environment-artifacts.tar.gz" -C $runDir environment.yml requirements.lock.txt python-packages.cdx.json } catch { Write-Host 'archive step skipped' }
                - aws s3 cp "$runDir\" "s3://${env:EPHEMERAL_BUCKET}/${env:EPHEMERAL_PREFIX}/$platform/$ts/" --recursive
                - aws s3 cp "$runDir\environment.yml" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/requirements/python/$platform/$ts/environment.yml"
                - if (Test-Path "$runDir\requirements.lock.txt") { aws s3 cp "$runDir\requirements.lock.txt" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/requirements/python/$platform/$ts/requirements.lock.txt" }
                - if (Test-Path "$runDir\approval-candidate-packages.csv") { aws s3 cp "$runDir\approval-candidate-packages.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/requirements/python/$platform/$ts/approval-candidate-packages.csv" }
                - if (Test-Path "$runDir\python-packages.cdx.json") { aws s3 cp "$runDir\python-packages.cdx.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/python/$platform/$ts/python-packages.cdx.json" }
                - if (Test-Path "$runDir\environment-artifacts.tar.gz") { aws s3 cp "$runDir\environment-artifacts.tar.gz" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/env-artifacts/python/$platform/$ts/environment-artifacts.tar.gz" }
                - if (Test-Path "$runDir\trivy-sbom-report.json") { aws s3 cp "$runDir\trivy-sbom-report.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/model-results/python/$platform/$ts/trivy-sbom-report.json" }
                - if (Test-Path "$runDir\safety-report.json") { aws s3 cp "$runDir\safety-report.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/model-results/python/$platform/$ts/safety-report.json" }
                - if (Test-Path "$runDir\fortify-report.txt") { aws s3 cp "$runDir\fortify-report.txt" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/model-results/python/$platform/$ts/fortify-report.txt" }
                - if (Test-Path "$runDir\vulnerability-findings.csv") { aws s3 cp "$runDir\vulnerability-findings.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/python/$platform/$ts/vulnerability-findings.csv" }
                - if (Test-Path "$runDir\remediation-required.csv") { aws s3 cp "$runDir\remediation-required.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/python/$platform/$ts/remediation-required.csv" }
                - if (Test-Path "$runDir\remediation-exceptions.csv") { aws s3 cp "$runDir\remediation-exceptions.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/python/$platform/$ts/remediation-exceptions.csv" }
                - if (Test-Path "$runDir\remediation-spreadsheet.csv") { aws s3 cp "$runDir\remediation-spreadsheet.csv" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/governance/python/$platform/$ts/remediation-spreadsheet.csv" }
                - if (Test-Path "$runDir\governance-summary.json") { aws s3 cp "$runDir\governance-summary.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/traceability/python/$platform/$ts/governance-summary.json" }
                - $metaJson = "{`"platform`":`"$platform`",`"timestamp_utc`":`"$ts`",`"ephemeral_prefix`":`"${env:EPHEMERAL_PREFIX}/$platform/$ts`",`"cleanup`":`"requested`"}"; $metaJson | Out-File "$runDir\run-metadata.json" -Encoding ascii
                - aws s3 cp "$runDir\run-metadata.json" "s3://${env:EVIDENCE_BUCKET}/${env:EVIDENCE_PREFIX}/traceability/python/$platform/$ts/run-metadata.json"
                - aws s3 rm "s3://${env:EPHEMERAL_BUCKET}/${env:EPHEMERAL_PREFIX}/$platform/$ts/" --recursive
                - if ($govExit -ne 0) { Write-Host "Governance gate failed with exit $govExit"; exit $govExit }
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: WINDOWS_SERVER_2022_CONTAINER
        Image: aws/codebuild/windows-base:2022-1.0
        ComputeType: !Ref WindowsComputeType
        EnvironmentVariables:
          - Name: INPUT_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateInputBucket, !Ref InputBucket, !Ref ExistingInputBucketName]
          - Name: INPUT_OBJECT_KEY
            Type: PLAINTEXT
            Value: inputs/python/environment.yml
          - Name: EVIDENCE_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEvidenceBucket, !Ref EvidenceBucket, !Ref ExistingEvidenceBucketName]
          - Name: EVIDENCE_PREFIX
            Type: PLAINTEXT
            Value: evidence
          - Name: EPHEMERAL_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEphemeralBucket, !Ref EphemeralBucket, !Ref ExistingEphemeralBucketName]
          - Name: EPHEMERAL_PREFIX
            Type: PLAINTEXT
            Value: deploy/tmp/python
          - Name: ENABLE_FORTIFY
            Type: PLAINTEXT
            Value: 'false'
          - Name: FORTIFY_COMMAND
            Type: PLAINTEXT
            Value: ''
          - Name: REMEDIATE_MEDIUM
            Type: PLAINTEXT
            Value: 'true'
          - Name: FAIL_ON_MEDIUM
            Type: PLAINTEXT
            Value: 'false'
          - Name: GOVERNANCE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-governance-artifacts.py
          - Name: TRIVY_VERSION
            Type: PLAINTEXT
            Value: !Ref TrivyVersion
          - Name: TRIVY_RELEASE_BASE_URL
            Type: PLAINTEXT
            Value: !Ref TrivyReleaseBaseUrl

