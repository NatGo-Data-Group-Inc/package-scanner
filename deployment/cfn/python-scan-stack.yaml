                - pip install --no-cache-dir --upgrade pip
                - pip install --no-cache-dir safety cyclonedx-bom
                - TRIVY_ARCHIVE="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
                - if ! aws s3 cp "s3://${EVIDENCE_BUCKET}/config/trivy/${TRIVY_ARCHIVE}" "/tmp/${TRIVY_ARCHIVE}" >/dev/null 2>&1; then curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "${TRIVY_RELEASE_BASE_URL}/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" -o "/tmp/${TRIVY_ARCHIVE}"; fi
                - if ! aws s3 cp "s3://${EVIDENCE_BUCKET}/config/trivy/trivy_${TRIVY_VERSION}_checksums.txt" /tmp/trivy_checksums.txt >/dev/null 2>&1; then curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "${TRIVY_RELEASE_BASE_URL}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt; fi
                - cd /tmp && grep " ${TRIVY_ARCHIVE}$" /tmp/trivy_checksums.txt | tr -d '\r' | sha256sum -c -
                - tar -xzf "/tmp/${TRIVY_ARCHIVE}" -C /tmp trivy
                - install -m 0755 /tmp/trivy /usr/local/bin/trivy
                - curl -sfL https://micro.mamba.pm/api/micromamba/linux-aarch64/latest | tar -xvj -C /tmp bin/micromamba
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${GOVERNANCE_SCRIPT_S3_KEY}" /tmp/generate-governance-artifacts.py
            build:
              commands:
                - set -euo pipefail
                - TS="$(date -u +%Y%m%dT%H%M%SZ)"
                - TARGET_PLATFORM="linux-arm64"
                - RUN_DIR="/tmp/scan-out/${TS}"
                - mkdir -p "${RUN_DIR}"
                - aws s3 cp "s3://${INPUT_BUCKET}/${INPUT_OBJECT_KEY}" /tmp/scan-input/environment.yml
                - cp /tmp/scan-input/environment.yml "${RUN_DIR}/environment.yml"
                - /tmp/bin/micromamba env create -f /tmp/scan-input/environment.yml -n target || /tmp/bin/micromamba env update -f /tmp/scan-input/environment.yml -n target
                - /tmp/bin/micromamba run -n target python -m pip list --format=freeze > "${RUN_DIR}/requirements.lock.txt" || true
                - python -m cyclonedx_py requirements "${RUN_DIR}/requirements.lock.txt" -o "${RUN_DIR}/python-packages.cdx.json" || true
                - trivy sbom --format json --output "${RUN_DIR}/trivy-sbom-report.json" "${RUN_DIR}/python-packages.cdx.json" || true
                - safety scan --file "${RUN_DIR}/requirements.lock.txt" --output json > "${RUN_DIR}/safety-report.json" || true
                - if [ "${ENABLE_FORTIFY:-false}" = "true" ] && [ -n "${FORTIFY_COMMAND:-}" ]; then eval "${FORTIFY_COMMAND}" > "${RUN_DIR}/fortify-report.txt" 2>&1 || true; fi
                - GOVERNANCE_EXIT=0
                - python /tmp/generate-governance-artifacts.py --run-dir "${RUN_DIR}" --platform "${TARGET_PLATFORM}" --remediate-medium "${REMEDIATE_MEDIUM:-true}" --fail-on-medium "${FAIL_ON_MEDIUM:-false}" || GOVERNANCE_EXIT=$?
                - tar -czf "${RUN_DIR}/environment-artifacts.tar.gz" -C "${RUN_DIR}" environment.yml requirements.lock.txt python-packages.cdx.json || true
                - aws s3 cp "${RUN_DIR}/" "s3://${EPHEMERAL_BUCKET}/${EPHEMERAL_PREFIX}/${TARGET_PLATFORM}/${TS}/" --recursive
                - aws s3 cp "${RUN_DIR}/environment.yml" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/python/${TARGET_PLATFORM}/${TS}/environment.yml"
                - if [ -f "${RUN_DIR}/requirements.lock.txt" ]; then aws s3 cp "${RUN_DIR}/requirements.lock.txt" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/python/${TARGET_PLATFORM}/${TS}/requirements.lock.txt"; fi
                - if [ -f "${RUN_DIR}/approval-candidate-packages.csv" ]; then aws s3 cp "${RUN_DIR}/approval-candidate-packages.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/python/${TARGET_PLATFORM}/${TS}/approval-candidate-packages.csv"; fi
                - if [ -f "${RUN_DIR}/python-packages.cdx.json" ]; then aws s3 cp "${RUN_DIR}/python-packages.cdx.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/python/${TARGET_PLATFORM}/${TS}/python-packages.cdx.json"; fi
                - if [ -f "${RUN_DIR}/environment-artifacts.tar.gz" ]; then aws s3 cp "${RUN_DIR}/environment-artifacts.tar.gz" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/python/${TARGET_PLATFORM}/${TS}/environment-artifacts.tar.gz"; fi
                - if [ -f "${RUN_DIR}/trivy-sbom-report.json" ]; then aws s3 cp "${RUN_DIR}/trivy-sbom-report.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/model-results/python/${TARGET_PLATFORM}/${TS}/trivy-sbom-report.json"; fi
                - if [ -f "${RUN_DIR}/safety-report.json" ]; then aws s3 cp "${RUN_DIR}/safety-report.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/model-results/python/${TARGET_PLATFORM}/${TS}/safety-report.json"; fi
                - if [ -f "${RUN_DIR}/fortify-report.txt" ]; then aws s3 cp "${RUN_DIR}/fortify-report.txt" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/model-results/python/${TARGET_PLATFORM}/${TS}/fortify-report.txt"; fi
                - if [ -f "${RUN_DIR}/vulnerability-findings.csv" ]; then aws s3 cp "${RUN_DIR}/vulnerability-findings.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/python/${TARGET_PLATFORM}/${TS}/vulnerability-findings.csv"; fi
                - if [ -f "${RUN_DIR}/remediation-required.csv" ]; then aws s3 cp "${RUN_DIR}/remediation-required.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/python/${TARGET_PLATFORM}/${TS}/remediation-required.csv"; fi
