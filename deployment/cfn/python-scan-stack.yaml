AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Redeployable multi-platform Python package scanning infrastructure.
  Creates native CodeBuild projects for linux/amd64, linux/arm64, and
  windows/amd64 with split S3 storage for long-term evidence and
  short-lived deployment artifacts.

Parameters:
  EnvironmentName:
    Type: String
    Default: pkgscan-dev

  ExistingInputBucketName:
    Type: String
    Default: ''

  ExistingEvidenceBucketName:
    Type: String
    Default: ''

  ExistingEphemeralBucketName:
    Type: String
    Default: ''

  BuildTimeoutMinutes:
    Type: Number
    Default: 90
    MinValue: 10
    MaxValue: 480

  LinuxComputeType:
    Type: String
    Default: BUILD_GENERAL1_MEDIUM
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
      - BUILD_GENERAL1_XLARGE
      - BUILD_GENERAL1_2XLARGE

  LinuxArmComputeType:
    Type: String
    Default: BUILD_GENERAL1_LARGE
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
      - BUILD_GENERAL1_XLARGE
      - BUILD_GENERAL1_2XLARGE

  WindowsComputeType:
    Type: String
    Default: BUILD_GENERAL1_LARGE
    AllowedValues:
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
      - BUILD_GENERAL1_XLARGE
      - BUILD_GENERAL1_2XLARGE

  TrivyVersion:
    Type: String
    Default: '0.69.3'

  TrivyReleaseBaseUrl:
    Type: String
    Default: 'https://github.com/aquasecurity/trivy/releases/download'

Conditions:
  CreateInputBucket: !Equals [!Ref ExistingInputBucketName, '']
  CreateEvidenceBucket: !Equals [!Ref ExistingEvidenceBucketName, '']
  CreateEphemeralBucket: !Equals [!Ref ExistingEphemeralBucketName, '']

Resources:
  InputBucket:
    Type: AWS::S3::Bucket
    Condition: CreateInputBucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-scan-input-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Condition: CreateEvidenceBucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-scan-evidence-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawHarvest
            Status: Enabled
            Prefix: evidence/raw-harvest/
            ExpirationInDays: 180

  EphemeralBucket:
    Type: AWS::S3::Bucket
    Condition: CreateEphemeralBucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-scan-ephemeral-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDeployArtifacts
            Status: Enabled
            Prefix: deploy/tmp/
            ExpirationInDays: 3

  ScanBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-pkgscan-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: BucketList
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !If [CreateInputBucket, !GetAtt InputBucket.Arn, !Sub 'arn:aws:s3:::${ExistingInputBucketName}']
                  - !If [CreateEvidenceBucket, !GetAtt EvidenceBucket.Arn, !Sub 'arn:aws:s3:::${ExistingEvidenceBucketName}']
                  - !If [CreateEphemeralBucket, !GetAtt EphemeralBucket.Arn, !Sub 'arn:aws:s3:::${ExistingEphemeralBucketName}']
        - PolicyName: BucketObjects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !If [CreateInputBucket, !Sub '${InputBucket.Arn}/*', !Sub 'arn:aws:s3:::${ExistingInputBucketName}/*']
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !If [CreateEvidenceBucket, !Sub '${EvidenceBucket.Arn}/*', !Sub 'arn:aws:s3:::${ExistingEvidenceBucketName}/*']
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !If [CreateEphemeralBucket, !Sub '${EphemeralBucket.Arn}/*', !Sub 'arn:aws:s3:::${ExistingEphemeralBucketName}/*']

  LinuxAmd64Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${EnvironmentName}-python-scan-linux-amd64'
      ServiceRole: !GetAtt ScanBuildRole.Arn
      TimeoutInMinutes: !Ref BuildTimeoutMinutes
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - set -euo pipefail
                - mkdir -p /tmp/scan-input /tmp/scan-out
                - pip install --no-cache-dir --upgrade pip
                - pip install --no-cache-dir safety cyclonedx-bom
                - TRIVY_ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                - if ! aws s3 cp "s3://${EVIDENCE_BUCKET}/config/trivy/${TRIVY_ARCHIVE}" "/tmp/${TRIVY_ARCHIVE}" >/dev/null 2>&1; then curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "${TRIVY_RELEASE_BASE_URL}/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" -o "/tmp/${TRIVY_ARCHIVE}"; fi
                - if ! aws s3 cp "s3://${EVIDENCE_BUCKET}/config/trivy/trivy_${TRIVY_VERSION}_checksums.txt" /tmp/trivy_checksums.txt >/dev/null 2>&1; then curl --retry 5 --retry-delay 2 --retry-connrefused -fsSL "${TRIVY_RELEASE_BASE_URL}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy_checksums.txt; fi
                - cd /tmp && grep " ${TRIVY_ARCHIVE}$" /tmp/trivy_checksums.txt | tr -d '\r' | sha256sum -c -
                - tar -xzf "/tmp/${TRIVY_ARCHIVE}" -C /tmp trivy
                - install -m 0755 /tmp/trivy /usr/local/bin/trivy
                - curl -sfL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C /tmp bin/micromamba
                - aws s3 cp "s3://${EVIDENCE_BUCKET}/${GOVERNANCE_SCRIPT_S3_KEY}" /tmp/generate-governance-artifacts.py
            build:
              commands:
                - set -euo pipefail
                - TS="$(date -u +%Y%m%dT%H%M%SZ)"
                - TARGET_PLATFORM="linux-amd64"
                - RUN_DIR="/tmp/scan-out/${TS}"
                - mkdir -p "${RUN_DIR}"
                - aws s3 cp "s3://${INPUT_BUCKET}/${INPUT_OBJECT_KEY}" /tmp/scan-input/environment.yml
                - cp /tmp/scan-input/environment.yml "${RUN_DIR}/environment.yml"
                - /tmp/bin/micromamba env create -f /tmp/scan-input/environment.yml -n target || /tmp/bin/micromamba env update -f /tmp/scan-input/environment.yml -n target
                - /tmp/bin/micromamba run -n target python -m pip list --format=freeze > "${RUN_DIR}/requirements.lock.txt" || true
                - python -m cyclonedx_py requirements "${RUN_DIR}/requirements.lock.txt" -o "${RUN_DIR}/python-packages.cdx.json" || true
                - trivy sbom --format json --output "${RUN_DIR}/trivy-sbom-report.json" "${RUN_DIR}/python-packages.cdx.json" || true
                - safety scan --file "${RUN_DIR}/requirements.lock.txt" --output json > "${RUN_DIR}/safety-report.json" || true
                - if [ "${ENABLE_FORTIFY:-false}" = "true" ] && [ -n "${FORTIFY_COMMAND:-}" ]; then eval "${FORTIFY_COMMAND}" > "${RUN_DIR}/fortify-report.txt" 2>&1 || true; fi
                - GOVERNANCE_EXIT=0
                - python /tmp/generate-governance-artifacts.py --run-dir "${RUN_DIR}" --platform "${TARGET_PLATFORM}" --remediate-medium "${REMEDIATE_MEDIUM:-true}" --fail-on-medium "${FAIL_ON_MEDIUM:-false}" || GOVERNANCE_EXIT=$?
                - tar -czf "${RUN_DIR}/environment-artifacts.tar.gz" -C "${RUN_DIR}" environment.yml requirements.lock.txt python-packages.cdx.json || true
                - aws s3 cp "${RUN_DIR}/" "s3://${EPHEMERAL_BUCKET}/${EPHEMERAL_PREFIX}/${TARGET_PLATFORM}/${TS}/" --recursive
                - aws s3 cp "${RUN_DIR}/environment.yml" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/python/${TARGET_PLATFORM}/${TS}/environment.yml"
                - if [ -f "${RUN_DIR}/requirements.lock.txt" ]; then aws s3 cp "${RUN_DIR}/requirements.lock.txt" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/python/${TARGET_PLATFORM}/${TS}/requirements.lock.txt"; fi
                - if [ -f "${RUN_DIR}/approval-candidate-packages.csv" ]; then aws s3 cp "${RUN_DIR}/approval-candidate-packages.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/requirements/python/${TARGET_PLATFORM}/${TS}/approval-candidate-packages.csv"; fi
                - if [ -f "${RUN_DIR}/python-packages.cdx.json" ]; then aws s3 cp "${RUN_DIR}/python-packages.cdx.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/python/${TARGET_PLATFORM}/${TS}/python-packages.cdx.json"; fi
                - if [ -f "${RUN_DIR}/environment-artifacts.tar.gz" ]; then aws s3 cp "${RUN_DIR}/environment-artifacts.tar.gz" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/env-artifacts/python/${TARGET_PLATFORM}/${TS}/environment-artifacts.tar.gz"; fi
                - if [ -f "${RUN_DIR}/trivy-sbom-report.json" ]; then aws s3 cp "${RUN_DIR}/trivy-sbom-report.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/model-results/python/${TARGET_PLATFORM}/${TS}/trivy-sbom-report.json"; fi
                - if [ -f "${RUN_DIR}/safety-report.json" ]; then aws s3 cp "${RUN_DIR}/safety-report.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/model-results/python/${TARGET_PLATFORM}/${TS}/safety-report.json"; fi
                - if [ -f "${RUN_DIR}/fortify-report.txt" ]; then aws s3 cp "${RUN_DIR}/fortify-report.txt" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/model-results/python/${TARGET_PLATFORM}/${TS}/fortify-report.txt"; fi
                - if [ -f "${RUN_DIR}/vulnerability-findings.csv" ]; then aws s3 cp "${RUN_DIR}/vulnerability-findings.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/python/${TARGET_PLATFORM}/${TS}/vulnerability-findings.csv"; fi
                - if [ -f "${RUN_DIR}/remediation-required.csv" ]; then aws s3 cp "${RUN_DIR}/remediation-required.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/python/${TARGET_PLATFORM}/${TS}/remediation-required.csv"; fi
                - if [ -f "${RUN_DIR}/remediation-exceptions.csv" ]; then aws s3 cp "${RUN_DIR}/remediation-exceptions.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/python/${TARGET_PLATFORM}/${TS}/remediation-exceptions.csv"; fi
                - if [ -f "${RUN_DIR}/remediation-spreadsheet.csv" ]; then aws s3 cp "${RUN_DIR}/remediation-spreadsheet.csv" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/governance/python/${TARGET_PLATFORM}/${TS}/remediation-spreadsheet.csv"; fi
                - if [ -f "${RUN_DIR}/governance-summary.json" ]; then aws s3 cp "${RUN_DIR}/governance-summary.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/traceability/python/${TARGET_PLATFORM}/${TS}/governance-summary.json"; fi
                - printf '{"platform":"%s","timestamp_utc":"%s","ephemeral_prefix":"%s/%s/%s","cleanup":"requested"}' "${TARGET_PLATFORM}" "${TS}" "${EPHEMERAL_PREFIX}" "${TARGET_PLATFORM}" "${TS}" > "${RUN_DIR}/run-metadata.json"
                - aws s3 cp "${RUN_DIR}/run-metadata.json" "s3://${EVIDENCE_BUCKET}/${EVIDENCE_PREFIX}/traceability/python/${TARGET_PLATFORM}/${TS}/run-metadata.json"
                - aws s3 rm "s3://${EPHEMERAL_BUCKET}/${EPHEMERAL_PREFIX}/${TARGET_PLATFORM}/${TS}/" --recursive
                - if [ "${GOVERNANCE_EXIT}" -ne 0 ]; then echo "Governance gate failed with exit ${GOVERNANCE_EXIT}"; exit "${GOVERNANCE_EXIT}"; fi
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: !Ref LinuxComputeType
        EnvironmentVariables:
          - Name: INPUT_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateInputBucket, !Ref InputBucket, !Ref ExistingInputBucketName]
          - Name: INPUT_OBJECT_KEY
            Type: PLAINTEXT
            Value: inputs/python/environment.yml
          - Name: EVIDENCE_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEvidenceBucket, !Ref EvidenceBucket, !Ref ExistingEvidenceBucketName]
          - Name: EVIDENCE_PREFIX
            Type: PLAINTEXT
            Value: evidence
          - Name: EPHEMERAL_BUCKET
            Type: PLAINTEXT
            Value: !If [CreateEphemeralBucket, !Ref EphemeralBucket, !Ref ExistingEphemeralBucketName]
          - Name: EPHEMERAL_PREFIX
            Type: PLAINTEXT
            Value: deploy/tmp/python
          - Name: ENABLE_FORTIFY
            Type: PLAINTEXT
            Value: 'false'
          - Name: FORTIFY_COMMAND
            Type: PLAINTEXT
            Value: ''
          - Name: REMEDIATE_MEDIUM
            Type: PLAINTEXT
            Value: 'true'
          - Name: FAIL_ON_MEDIUM
            Type: PLAINTEXT
            Value: 'false'
          - Name: GOVERNANCE_SCRIPT_S3_KEY
            Type: PLAINTEXT
            Value: config/generate-governance-artifacts.py
          - Name: TRIVY_VERSION
            Type: PLAINTEXT
            Value: !Ref TrivyVersion
          - Name: TRIVY_RELEASE_BASE_URL
            Type: PLAINTEXT
            Value: !Ref TrivyReleaseBaseUrl

  LinuxArm64Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${EnvironmentName}-python-scan-linux-arm64'
      ServiceRole: !GetAtt ScanBuildRole.Arn
      TimeoutInMinutes: !Ref BuildTimeoutMinutes
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - set -euo pipefail
