  RStagePlannerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-r-stage-planner'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt RStagePlannerRole.Arn
      Code:
        ZipFile: |
          import json
          import re
          from collections import defaultdict, deque
          import boto3

          s3 = boto3.client("s3")
          DEP_FIELDS = ("Depends", "Imports", "LinkingTo")
          NAME_RE = re.compile(r"^[A-Za-z][A-Za-z0-9.]*")


          def dep_name(entry):
              m = NAME_RE.match((entry or "").strip())
              if not m:
                  return None
              name = m.group(0)
              return None if name == "R" else name


          def package_deps(record, known):
              names = []
              for field in DEP_FIELDS:
                  for entry in record.get(field, []):
                      name = dep_name(entry)
                      if name and name in known:
                          names.append(name)
              return sorted(set(names), key=str.lower)


          def topo_sort(packages):
              known = set(packages)
              deps = {name: package_deps(record, known) for name, record in packages.items()}
              dependents = defaultdict(set)
              indegree = {name: len(values) for name, values in deps.items()}
              for name, values in deps.items():
                  for dep in values:
                      dependents[dep].add(name)
              ready = deque(sorted((name for name, degree in indegree.items() if degree == 0), key=str.lower))
              ordered = []
              while ready:
                  current = ready.popleft()
                  ordered.append(current)
                  for dependent in sorted(dependents.get(current, ()), key=str.lower):
                      indegree[dependent] -= 1
                      if indegree[dependent] == 0:
                          ready.append(dependent)
              if len(ordered) != len(packages):
                  ordered.extend(sorted((name for name in packages if name not in ordered), key=str.lower))
              return ordered


          def handler(event, _context):
              obj = s3.get_object(Bucket=event["input_bucket"], Key=event["input_object_key"])
              payload = json.loads(obj["Body"].read().decode("utf-8-sig"))
              ordered = topo_sort(payload.get("Packages", {}))
              chunk_size = max(1, int(event.get("stage_package_count", 25)))
              stages = []
              for index in range(0, len(ordered), chunk_size):
                  chunk = ordered[index:index + chunk_size]
                  stages.append(
                      {
                          "stage_index": str(len(stages) + 1),
                          "package_count": len(chunk),
                          "packages_json": json.dumps(chunk),
                          "final_stage": "false",
                      }
                  )
              if not stages:
                  stages = [{"stage_index": "1", "package_count": 0, "packages_json": "[]", "final_stage": "true"}]
              else:
                  stages[-1]["final_stage"] = "true"
              total = str(len(stages))
              for stage in stages:
                  stage["total_stages"] = total
              return {
                  "package_count": len(ordered),
                  "stage_count": len(stages),
                  "stages": stages,
              }

  RScanSummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-r-scan-summary'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt RScanSummaryRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          from botocore.exceptions import ClientError

          s3 = boto3.client("s3")
          events = boto3.client("events")


          def head_exists(bucket, key):
              try:
                  s3.head_object(Bucket=bucket, Key=key)
                  return True
              except ClientError as exc:
                  if exc.response["Error"]["Code"] in {"404", "NoSuchKey", "NotFound"}:
                      return False
                  raise


          def list_keys(bucket, prefix):
              paginator = s3.get_paginator("list_objects_v2")
              keys = []
              for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
                  keys.extend(obj["Key"] for obj in page.get("Contents", []))
              return keys


          def handler(event, _context):
              bucket = event["evidence_bucket"]
              prefix = event.get("evidence_prefix", "evidence").rstrip("/")
              timestamp = event["scan_timestamp"]
              execution_id = event["scan_execution_id"]
              platforms = []
              overall = "SUCCEEDED"

              for result in event["results"]:
                  platform = result["platform"]
                  status = result["status"]
                  platform_summary = {
                      "platform": platform,
                      "status": status,
                      "build_id": result.get("buildId"),
                      "project_name": result.get("projectName"),
                      "validated": False,
                  }

                  if status == "SUCCEEDED":
                      required = [
                          f"{prefix}/requirements/r/{platform}/{timestamp}/renv.lock",
                          f"{prefix}/requirements/r/{platform}/{timestamp}/installed-packages.csv",
                          f"{prefix}/traceability/r/{platform}/{timestamp}/materialization-summary.json",
                          f"{prefix}/traceability/r/{platform}/{timestamp}/run-metadata.json",
                      ]
                      missing = [key for key in required if not head_exists(bucket, key)]
                      bundle_prefix = f"{prefix}/packages/offline/r/{platform}/{timestamp}/"
                      bundle_keys = list_keys(bucket, bundle_prefix)
                      tarballs = [key for key in bundle_keys if key.endswith(".tar.gz")]
                      checksums = [key for key in bundle_keys if key.endswith(".tar.gz.sha256")]
                      if not tarballs:
                          missing.append(f"{bundle_prefix}*.tar.gz")
                      if not checksums:
                          missing.append(f"{bundle_prefix}*.tar.gz.sha256")
                      platform_summary["bundle_keys"] = bundle_keys
                      platform_summary["missing"] = missing
                      platform_summary["validated"] = not missing
                      if missing:
                          platform_summary["status"] = "FAILED"
                          platform_summary["validation_error"] = "required artifacts missing"
                          overall = "FAILED"
                  else:
                      overall = "FAILED"
                      platform_summary["error"] = result.get("error")
                      platform_summary["cause"] = result.get("cause")

                  platforms.append(platform_summary)

              summary = {
                  "scan_execution_id": execution_id,
                  "scan_timestamp": timestamp,
                  "overall_status": overall,
                  "platforms": platforms,
              }
              summary_key = f"{prefix}/orchestration/r/{execution_id}/orchestration-summary.json"
              s3.put_object(
                  Bucket=bucket,
                  Key=summary_key,
                  Body=json.dumps(summary, indent=2).encode("utf-8"),
                  ContentType="application/json",
              )
              summary["summary_key"] = summary_key
              events.put_events(
                  Entries=[
                      {
                          "Source": "package-scanner.r",
                          "DetailType": f"R Materialization Orchestration {overall}",
                          "Detail": json.dumps(summary),
                      }
                  ]
              )
              return summary

